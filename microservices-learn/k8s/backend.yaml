apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-backend-deployment
  labels:
    app: notification-backend
spec:
  replicas: 2 # 👈 Kubernetes bisa otomatis menjalankan 2 pod/server sekaligus (Load Balancing)
  selector:
    matchLabels:
      app: notification-backend
  template:
    metadata:
      labels:
        app: notification-backend
    spec:
      containers:
        - name: notification-backend
          image: notification-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-backend-service
spec:
  type: NodePort
  selector:
    app: notification-backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
